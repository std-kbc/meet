<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - 채팅방 목록</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header>
    <h1><a href="/index.html" class="brand-link">Chat</a></h1>
    <div class="actions">
        <span class="user-info" id="userInfo"></span>
        <button type="button" class="btn-outline btn-sm" onclick="window.open('/swagger-ui/index.html', '_blank', 'noopener')">API 문서</button>
        <button class="btn-danger btn-sm" id="logoutBtn">로그아웃</button>
    </div>
</header>

<div id="errorBanner" class="error-banner"></div>

<main class="page page-list">
    <div class="list-toolbar">
        <h2>채팅방</h2>
        <div class="list-actions">
            <button class="btn-primary btn-sm" id="createRoomBtn">+ 새 방</button>
            <button class="btn-outline btn-sm" id="joinRoomBtn">ID 입장</button>
        </div>
    </div>
    <ul class="room-list room-list-full" id="roomList">
        <li class="empty-state">불러오는 중...</li>
    </ul>
</main>

<div class="modal-overlay" id="createModal">
    <div class="modal">
        <h3>새 채팅방</h3>
        <form id="createForm">
            <div class="form-group">
                <label for="roomType">유형</label>
                <select id="roomType" required>
                    <option value="GROUP">그룹</option>
                    <option value="DIRECT">1:1</option>
                </select>
            </div>
            <div class="form-group">
                <label for="roomName">방 이름</label>
                <input id="roomName" type="text" maxlength="100" required placeholder="프로젝트 A 팀">
            </div>
            <div class="form-group" id="targetUserIdGroup" style="display: none;">
                <label for="targetUserId">상대 사용자 ID</label>
                <input id="targetUserId" type="number" min="1" placeholder="2">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-outline" id="cancelCreateBtn">취소</button>
                <button type="submit" class="btn-primary">만들기</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="joinModal">
    <div class="modal modal-join">
        <h3>채팅방 ID로 입장</h3>
        <form id="joinForm">
            <div class="form-group">
                <label for="joinRoomId">채팅방 ID</label>
                <input id="joinRoomId" type="number" min="1" required placeholder="1">
                <button type="button" class="btn-outline btn-sm browse-toggle-btn" id="browseAllRoomsBtn">목록 확인</button>
            </div>
            <div class="browse-room-panel" id="browseRoomPanel">
                <div class="browse-room-panel-header">
                    <span class="browse-room-panel-title">입장 가능한 채팅방</span>
                    <button type="button" class="btn-outline btn-sm" id="closeBrowseRoomBtn">닫기</button>
                </div>
                <div class="browse-room-list-wrap">
                    <ul class="browse-room-list" id="browseRoomList">
                        <li class="empty-state">목록을 불러오려면 위 버튼을 누르세요.</li>
                    </ul>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-outline" id="cancelJoinBtn">취소</button>
                <button type="submit" class="btn-primary">입장</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/rooms.js"></script>
</body>
</html>
