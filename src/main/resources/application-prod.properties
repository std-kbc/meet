# 운영 프로필: SPRING_PROFILES_ACTIVE=prod
# application.properties의 개발용 값을 환경변수로 덮어쓴다.
# 비밀값은 기본값을 두지 않는다. 빠지면 서버 시작이 실패한다 (DB·Redis는 ProdStartupCheck가 확인).

spring.application.name=ocsmeet

# MariaDB (compose 안에서는 jdbc:mariadb://mariadb:3306/DEMO)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Redis (compose 안에서는 host=redis)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

# JWT: 운영 전용 키 (openssl rand -base64 32)
jwt.secret=${JWT_SECRET}

# 쿠키 (쿠키 모드 사용 시)
cookie.domain=${COOKIE_DOMAIN}

# 화상통화 ICE 서버
rtc.stun-url=${RTC_STUN_URL}
rtc.turn-urls=${RTC_TURN_URLS}
rtc.turn-secret=${RTC_TURN_SECRET}
# TURN credential 유효 시간 (개발은 24시간). 유출돼도 오래 쓰지 못하게 1시간으로
rtc.turn-ttl-seconds=3600

# Caddy(HTTPS) 뒤에서 실행: X-Forwarded-* 헤더를 보고 원래 요청을 https로 인식
server.forward-headers-strategy=native
