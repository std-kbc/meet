spring.application.name=chat

# MariaDB
spring.datasource.url=jdbc:mariadb://localhost:33306/DEMO
spring.datasource.username=maria
spring.datasource.password=application
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.std.chat.auth.domain,com.std.chat.room.domain,com.std.chat.message.domain

# JWT
jwt.secret=TnSClriGI2KC5ehl4KLJt2/+DNSVL7B3eFF1ed/kvtM=
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# 토큰 전달 방식 (true=헤더, false=쿠키)
auth.use-header-token=true

# 쿠키 (쿠키 모드 사용 시)
cookie.domain=localhost

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=36379
spring.data.redis.password=redis

# 화상통화 ICE 서버 (환경변수로 덮어쓰기)
rtc.stun-url=${RTC_STUN_URL:stun:localhost:53478}
rtc.turn-urls=${RTC_TURN_URLS:turn:localhost:53478}
rtc.turn-secret=${RTC_TURN_SECRET:local-dev-turn-secret}
rtc.turn-ttl-seconds=86400